<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Web Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>My Interactive Web Page</h1>

        <section>
            <h2>Change the Message</h2>
            <p id="message">Click the button to change this message!</p>
            <button id="changeButton">Change Message</button>
        </section>

        <section>
            <h2>Type Your Name</h2>
            <input type="text" id="nameInput" placeholder="Enter your name">
            <p id="nameDisplay">Your name will appear here.</p>
        </section>

        <section>
            <h2>My List</h2>
            <input type="text" id="itemInput" placeholder="Enter an item">
            <button id="addButton">Add Item</button>

            <ul id="itemList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
